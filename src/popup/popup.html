<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tailboard</title>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --fg:#1c1917; --sub:#78716c; --line:#e7e5e4; --hover:#f5f5f4; --accent:#6366f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#fafaf9; --sub:#a8a29e; --line:#292524; --hover:#292524; } }
    * { box-sizing: border-box; }
    body { margin:0; width:320px; max-height:480px; font:14px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; }
    header { position:sticky; top:0; background:var(--bg); padding:10px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
    #q { flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); outline:none; }
    #q:focus { border-color:var(--accent); }
    #opts { border:none; background:transparent; color:var(--sub); cursor:pointer; font-size:16px; padding:4px; }
    #list { overflow-y:auto; padding:6px; }
    .grp { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--sub); padding:8px 8px 4px; }
    .lnk { width:100%; display:flex; align-items:center; gap:8px; padding:7px 8px; border:none; background:transparent; color:var(--fg); text-align:left; border-radius:8px; cursor:pointer; font:inherit; }
    .lnk:hover, .lnk:focus { background:var(--hover); outline:none; }
    .dot { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
    .dot.up { background:#4ade80; } .dot.down { background:#ef4444; } .dot.unk { background:#a8a29e; }
    #empty { padding:24px 12px; text-align:center; color:var(--sub); }
  </style>
</head>
<body>
  <header>
    <input id="q" type="text" placeholder="Search links…" autocomplete="off" autofocus>
    <button id="opts" title="Options">⚙</button>
  </header>
  <div id="list"></div>
  <p id="empty" hidden></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
